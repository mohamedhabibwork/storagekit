name: Changelog

# Regenerate CHANGELOG.md from conventional commits whenever a release tag
# is pushed, and commit it back to the default branch. Runs alongside the
# publish workflow (which stays tag-driven and does not depend on this).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changelog:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: conventional-changelog reads all tags/commits (-r 0)
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate CHANGELOG.md
        run: npm run changelog
      - name: Commit CHANGELOG.md
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch || 'main' }}
